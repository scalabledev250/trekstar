<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <header class="site-header">
    <h1>TREKBOUND</h1>
  </header>

  <main class="auth-hero">
    <div class="auth-panel">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Choose how you want to log in.</p>
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <a href="{{ url_for('auth.adminlogin') }}" class="role-tile">
            <strong>Admin login</strong>
            <span>Manage treks, staff, users and bookings.</span>
          </a>
        </div>
        <div class="col-12 col-md-4">
          <a href="{{ url_for('auth.stafflogin') }}" class="role-tile">
            <strong>Staff login</strong>
            <span>See the treks you are assigned to.</span>
          </a>
        </div>
        <div class="col-12 col-md-4">
          <a href="{{ url_for('auth.userlogin') }}" class="role-tile">
            <strong>User login</strong>
            <span>Browse treks and manage your bookings.</span>
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
