<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <header class="site-header">
        <h1>TREKBOUND</h1>
    </header>

    <main class="auth-hero">
        <div class="auth-panel auth-panel-narrow">
            <h2 class="auth-title">Create your account</h2>
            <p class="auth-sub">Join as a trekker or as a staff member.</p>
            <form class="auth-form" action="{{ url_for('auth.userregister') }}" method="POST">
                <div class="form-floating mb-3">
                    <input id="uname" type="text" class="form-control" name="username" placeholder="Enter Username" required>
                    <label for="uname">Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input id="email" type="email" class="form-control" name="email" placeholder="Enter Email address" required>
                    <label for="email">Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input id="password" type="password" class="form-control" name="password" placeholder="Enter Password" required>
                    <label for="password">Password</label>
                </div>
                <div class="form-floating mb-3">
                    <select id="role" class="form-select" name="role" required>
                        <option selected disabled>None</option>
                        <option value="staff">Staff Member</option>
                        <option value="trekker">User(Trekker)</option>
                    </select>
                    <label for="role">I am a</label>
                </div>
                <p class="auth-note">Staff accounts are approved by an admin before they can log in.</p>
                <button type="submit" class="btn-auth">Register</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
        </div>
    </main>
</body>
</html>
