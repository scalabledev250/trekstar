<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='loginpage.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <h1>TrekBound</h1>
  </header>

  <main class="auth-hero">
    <div class="auth-panel auth-panel-narrow">
      <h2 class="auth-title">{% block heading %}Login{% endblock %}</h2>
      <p class="auth-sub">Enter your email and password to continue.</p>
      <form class="auth-form" action="{% block url %}{% endblock %}" method="POST">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter Email address" autocomplete="email" required>
          <label for="email">Email address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required>
          <label for="password">Password</label>
        </div>
        <button type="submit" class="btn-auth">Login</button>
        {% if error %}
        <div class="alert alert-danger mt-3 mb-0" role="alert">
          {{ error }}
        </div>
        {% endif %}
      </form>
      <p class="auth-switch">
        Don't have an account? <a href="{{ url_for('auth.userregister') }}">Register here</a>
      </p>
      <p class="auth-switch auth-switch-alt">
        Wrong role? <a href="{{ url_for('auth.login') }}">Choose another login</a>
      </p>
    </div>
  </main>
</body>
</html>
