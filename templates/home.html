<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekBound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">

<body>
  <header class="site-header">
    <h1>TREKBOUND</h1>
  </header>
  <main class="home-hero">
    <div class="welcome-panel">
      <h2>Welcome to TrekBound</h2>
      <p>Log in to pick up where you left off, or create an account to get started.</p>
      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <a href="{{ url_for('auth.login') }}" class="home-btn home-btn-primary">Log in</a>
        </div>
        <div class="col-12 col-sm-6">
          <a href="{{ url_for('auth.userregister') }}" class="home-btn home-btn-secondary">Register</a>
        </div>
      </div>
    </div>
  </main>

</html>
